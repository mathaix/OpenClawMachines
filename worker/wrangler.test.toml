name = "ocm-host-rewrite-test"
main = "worker.js"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

[vars]
VERSION = "test-1.0.0"
JWT_SECRET = "test-jwt-secret-for-unit-tests-only"
CF_SERVICE_TOKEN_ID = "test-cf-token-id"
CF_SERVICE_TOKEN_SECRET = "test-cf-token-secret"
RESOLVE_ORIGIN = "http://127.0.0.1:54321"
ALLOW_INSECURE_LOCAL_AGENT_ORIGIN = "1"

[[kv_namespaces]]
binding = "OCM_ROUTES"
id = "test-ocm-routes"
