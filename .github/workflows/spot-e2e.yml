name: Spot E2E

# Admin-only merge gate (Actions-tab dispatch). Verifies the actor is a repo
# admin + the SHA matches the PR head, then calls the reusable spot-e2e-run
# workflow which provisions a real GCE spot host, runs the Playwright smoke,
# uploads artifacts, tears down, and posts the `spot-e2e` commit status.
#
# PR-comment "/spot-e2e" triggers the same reusable job via comment-commands.yml.
# Security: no pull_request trigger — secrets/VMs are never exposed to fork PRs.
#
# Config: see docs/spot-e2e-ci.md (repo vars + WIF secrets + Secret Manager).

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to gate
        required: true
        type: number
      sha:
        description: Exact PR head SHA to test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: spot-e2e
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize (admins only)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Require admin
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          perm="$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq .permission)"
          echo "actor=${ACTOR} permission=${perm}"
          case "$perm" in
            admin) ;;
            *) echo "Only repo admins can run Spot E2E (actor has '${perm}')." >&2; exit 1 ;;
          esac

      - name: Validate PR head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${REPO}/pulls/${PR}" --jq .head.sha)"
          test "${head_sha}" = "${SHA}"

  run:
    name: Run
    needs: authorize
    uses: ./.github/workflows/spot-e2e-run.yml
    with:
      pr: ${{ inputs.pr }}
      sha: ${{ inputs.sha }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      statuses: write
