name: Codex Review

# Admin-only Codex review (Actions-tab dispatch). Verifies the actor is a repo
# admin, then calls the reusable codex-review-run workflow (it runs PR code with
# OPENAI_API_KEY). PR-comment "/codex-review" triggers the same reusable job via
# comment-commands.yml.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: codex-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize (admins only)
    runs-on: ubuntu-latest
    steps:
      - name: Require admin
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          perm="$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq .permission)"
          echo "actor=${ACTOR} permission=${perm}"
          case "$perm" in
            admin) ;;
            *) echo "Only repo admins can run Codex Review (actor has '${perm}')." >&2; exit 1 ;;
          esac

  run:
    name: Run
    needs: authorize
    uses: ./.github/workflows/codex-review-run.yml
    with:
      pr_number: ${{ inputs.pr_number }}
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
