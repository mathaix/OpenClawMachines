name: Codex Review (run)

# Reusable: run a Codex review on a PR and post the result as a comment. No
# authorization here — callers (codex-review.yml dispatch, comment-commands.yml)
# must gate on admin first (it runs PR code with OPENAI_API_KEY).
on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string

jobs:
  review:
    name: Codex Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Codex
        run: npm install -g @openai/codex@0.117.0
        working-directory: /tmp

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out reviewed PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr checkout "$PR_NUMBER"

      - name: Configure Codex auth (subscription)
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${CODEX_AUTH_JSON:-}" ]; then
            echo "::error::CODEX_AUTH_JSON secret is not set. Store your Codex auth.json (from 'codex login' / the subscription PKCE flow) as a repo/org secret — do NOT commit it." >&2
            exit 1
          fi
          mkdir -p "$HOME/.codex"
          printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
          chmod 600 "$HOME/.codex/auth.json"

      - name: Run Codex review
        run: |
          PROMPT="Focus on bugs, logic errors, security issues, and code quality. This is a Go + TypeScript project (Go backend, React frontend, Cloudflare Worker). Only report high-confidence issues."
          if codex review --base origin/main "$PROMPT" > /tmp/review.md 2>/tmp/review.err; then
            echo "CODEX_OK=1" >> "$GITHUB_ENV"
          else
            echo "CODEX_OK=0" >> "$GITHUB_ENV"
            echo "::warning::codex review failed; see /tmp/review.err in logs"
            sed -n '1,40p' /tmp/review.err || true
          fi

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${CODEX_OK:-0}" = "1" ] && [ -s /tmp/review.md ]; then
            head -c 60000 /tmp/review.md > /tmp/review-trimmed.md
            {
              echo "## Codex Review"
              echo ""
              cat /tmp/review-trimmed.md
              echo ""
              echo "---"
              echo "_Automated review by OpenAI Codex_"
            } > /tmp/review-final.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/review-final.md
          else
            echo "Codex review did not produce output (see workflow logs)"
          fi
