server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets (Vite content-hashed filenames) — cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html — never cache so deployments take effect immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    absolute_redirect off;

    # Proxy Firebase Auth handler to allow custom authDomain (openclawmachines.com)
    # This avoids third-party cookie issues on mobile browsers
    location /__/auth/ {
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;
        proxy_pass https://clarateach.firebaseapp.com/__/auth/;
        proxy_set_header Host clarateach.firebaseapp.com;
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri /index.html;
    }
}
