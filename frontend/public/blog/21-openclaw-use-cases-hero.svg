<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="claw-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea4647"/>
      <stop offset="40%" stop-color="#c83232"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <radialGradient id="glow-red" cx="0.25" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ea4647" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ea4647" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-teal" cx="0.75" cy="0.4" r="0.45">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow-red)"/>
  <rect width="1200" height="630" fill="url(#glow-teal)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#2DD4BF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Network constellation — left cluster -->
  <g opacity="0.15">
    <line x1="80" y1="120" x2="200" y2="220" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="200" y1="220" x2="150" y2="380" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
    <line x1="200" y1="220" x2="340" y2="180" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
    <line x1="340" y1="180" x2="300" y2="340" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="150" y1="380" x2="300" y2="340" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="80" y1="120" x2="180" y2="60" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="300" y1="340" x2="350" y2="480" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="80" cy="120" r="6" fill="#2DD4BF"/>
    <circle cx="200" cy="220" r="8" fill="#2DD4BF"/>
    <circle cx="150" cy="380" r="5" fill="#2DD4BF"/>
    <circle cx="340" cy="180" r="5" fill="#2DD4BF"/>
    <circle cx="300" cy="340" r="7" fill="#2DD4BF"/>
    <circle cx="180" cy="60" r="4" fill="#2DD4BF"/>
    <circle cx="350" cy="480" r="4" fill="#2DD4BF"/>
  </g>

  <!-- Network constellation — right cluster -->
  <g opacity="0.12">
    <line x1="900" y1="100" x2="1020" y2="200" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
    <line x1="1020" y1="200" x2="1100" y2="130" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
    <line x1="1020" y1="200" x2="960" y2="350" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="960" y1="350" x2="1080" y2="400" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="1100" y1="130" x2="1140" y2="280" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="1140" y1="280" x2="1080" y2="400" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="900" y1="100" x2="850" y2="220" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="850" y1="220" x2="960" y2="350" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="900" cy="100" r="5" fill="#2DD4BF"/>
    <circle cx="1020" cy="200" r="7" fill="#2DD4BF"/>
    <circle cx="1100" cy="130" r="5" fill="#2DD4BF"/>
    <circle cx="960" cy="350" r="6" fill="#2DD4BF"/>
    <circle cx="1080" cy="400" r="4" fill="#2DD4BF"/>
    <circle cx="1140" cy="280" r="4" fill="#2DD4BF"/>
    <circle cx="850" cy="220" r="5" fill="#2DD4BF"/>
  </g>

  <!-- Floating use-case nodes — scattered numbered circles -->
  <g>
    <!-- Node 1 -->
    <circle cx="120" cy="500" r="22" fill="#1f2937" stroke="#374151" stroke-width="1.5" opacity="0.7"/>
    <text x="120" y="506" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ea4647">1</text>
    <!-- Node 5 -->
    <circle cx="280" cy="80" r="18" fill="#1f2937" stroke="#374151" stroke-width="1.5" opacity="0.5"/>
    <text x="280" y="86" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ea4647">5</text>
    <!-- Node 7 -->
    <circle cx="420" cy="540" r="20" fill="#1f2937" stroke="#374151" stroke-width="1.5" opacity="0.6"/>
    <text x="420" y="546" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ea4647">7</text>
    <!-- Node 10 -->
    <circle cx="750" cy="520" r="24" fill="#1f2937" stroke="#ea4647" stroke-width="1.5" opacity="0.7"/>
    <text x="750" y="527" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ea4647">10</text>
    <!-- Node 14 -->
    <circle cx="880" cy="480" r="16" fill="#1f2937" stroke="#374151" stroke-width="1.5" opacity="0.5"/>
    <text x="880" y="486" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ea4647">14</text>
    <!-- Node 19 -->
    <circle cx="1050" cy="520" r="19" fill="#1f2937" stroke="#374151" stroke-width="1.5" opacity="0.6"/>
    <text x="1050" y="526" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ea4647">19</text>
    <!-- Node 21 -->
    <circle cx="1150" cy="60" r="17" fill="#1f2937" stroke="#2DD4BF" stroke-width="1.5" opacity="0.5"/>
    <text x="1150" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2DD4BF">21</text>
    <!-- Node 3 -->
    <circle cx="60" cy="300" r="15" fill="#1f2937" stroke="#374151" stroke-width="1.5" opacity="0.4"/>
    <text x="60" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ea4647">3</text>
    <!-- Node 12 -->
    <circle cx="1160" cy="450" r="16" fill="#1f2937" stroke="#374151" stroke-width="1.5" opacity="0.45"/>
    <text x="1160" y="456" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ea4647">12</text>
    <!-- Node 16 -->
    <circle cx="480" cy="70" r="14" fill="#1f2937" stroke="#374151" stroke-width="1.5" opacity="0.4"/>
    <text x="480" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#2DD4BF">16</text>
  </g>

  <!-- Center claw icon -->
  <g transform="translate(480, 130) scale(0.52)" opacity="0.12">
    <path d="
      M 175 85
      C 140 68, 78 78, 55 125
      C 28 180, 22 255, 50 325
      C 75 390, 145 438, 256 448
      C 367 438, 437 390, 462 325
      C 490 255, 484 180, 457 125
      C 434 78, 372 68, 337 85
      C 318 95, 315 120, 325 152
      C 345 210, 368 278, 350 340
      C 335 380, 298 405, 256 412
      C 214 405, 177 380, 162 340
      C 144 278, 167 210, 187 152
      C 197 120, 194 95, 175 85
      Z
    " fill="url(#claw-grad)"/>
  </g>

  <!-- Big number "21" -->
  <text x="600" y="310" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="180" font-weight="900" fill="#ea4647" opacity="0.15" letter-spacing="-8">
    21
  </text>

  <!-- Title text -->
  <text x="600" y="280" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#f9fafb" letter-spacing="-1.5">
    Use Cases
  </text>

  <!-- Subtitle -->
  <text x="600" y="340" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#9ca3af" letter-spacing="4">
    THE COMPLETE DEEP DIVE
  </text>

  <!-- Thin separator -->
  <line x1="480" y1="370" x2="720" y2="370" stroke="#ea4647" stroke-width="2" opacity="0.4"/>

  <!-- Based on label -->
  <text x="600" y="410" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#64748b" letter-spacing="2">
    BASED ON MATTHEW BERMAN'S VIRAL VIDEO
  </text>

  <!-- OCM branding bottom right -->
  <text x="1170" y="610" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#374151" letter-spacing="1">
    openclawmachines.com
  </text>
</svg>
