<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCM Prototypes</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #0a0c14;
      color: #f0f1f4;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding: 20px;
    }

    .switcher {
      display: flex; gap: 4px; justify-content: center; margin-bottom: 16px;
    }
    .switcher button {
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
      padding: 8px 20px; border-radius: 8px; border: 1px solid #1c2035; cursor: pointer;
      color: #8b90a0; background: #12141e; transition: all 0.15s;
    }
    .switcher button:hover { color: #f0f1f4; background: #181b28; }
    .switcher button.active-ocm { background: #ea580c; color: white; border-color: #ea580c; }
    .switcher button.active-branded { background: #2563eb; color: white; border-color: #2563eb; }

    .browser-frame {
      max-width: 1200px; margin: 0 auto;
      border: 1px solid #1c2035; border-radius: 12px; overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      background: #12141e;
    }

    .address-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: #0e1017;
      border-bottom: 1px solid #1c2035;
    }
    .traffic-lights { display: flex; gap: 6px; }
    .traffic-dot { width: 10px; height: 10px; border-radius: 50%; }
    .traffic-dot.red { background: #ff5f57; }
    .traffic-dot.yellow { background: #ffbd2e; }
    .traffic-dot.green { background: #28c840; }

    .url-bar {
      flex: 1; background: #181b28; border: 1px solid #1c2035; border-radius: 6px;
      padding: 6px 12px; font-family: 'DM Sans', sans-serif; font-size: 12px;
      color: #8b90a0; display: flex; align-items: center; gap: 6px;
    }
    .url-bar .lock { color: #4ade80; font-size: 11px; }
    .url-slug { color: #f0f1f4; font-weight: 600; }
    .url-path { color: #555a6d; }

    .browser-frame iframe {
      width: 100%; height: calc(100vh - 120px); border: none;
      background: #07080d;
    }
  </style>
</head>
<body>
  <div class="switcher">
    <button class="active-ocm" onclick="loadOCM(this)">app.openclawmachines.com</button>
    <button onclick="loadBranded(this)">acme.openclawmachines.com</button>
  </div>

  <div class="browser-frame">
    <div class="address-bar">
      <div class="traffic-lights">
        <div class="traffic-dot red"></div>
        <div class="traffic-dot yellow"></div>
        <div class="traffic-dot green"></div>
      </div>
      <div class="url-bar">
        <span class="lock">&#x1f512;</span>
        <span class="url-slug" id="url-slug">app.openclawmachines.com</span><span class="url-path" id="url-path">/dashboard</span>
      </div>
    </div>
    <iframe id="proto-frame" src="prototype-simplified.html"></iframe>
  </div>

  <script>
    function loadOCM(btn) {
      document.getElementById('proto-frame').src = 'prototype-simplified.html';
      document.getElementById('url-slug').textContent = 'app.openclawmachines.com';
      document.getElementById('url-path').textContent = '/dashboard';
      document.querySelectorAll('.switcher button').forEach(function(b) { b.className = ''; });
      btn.className = 'active-ocm';
    }
    function loadBranded(btn) {
      document.getElementById('proto-frame').src = 'prototype-branded.html';
      document.getElementById('url-slug').textContent = 'acme.openclawmachines.com';
      document.getElementById('url-path').textContent = '/dashboard';
      document.querySelectorAll('.switcher button').forEach(function(b) { b.className = ''; });
      btn.className = 'active-branded';
    }
  </script>
</body>
</html>
