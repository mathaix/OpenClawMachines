<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpenClaw Machines - T-Shirt Print Asset</title>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; flex-direction: column; align-items: center; gap: 80px; padding: 60px; }

    /* Print area: 12" x 5" at 300dpi = 3600x1500px, scaled to screen */
    .print-asset {
      width: 1200px;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      position: relative;
    }

    .print-asset .mascots {
      width: 320px;
      height: 320px;
      flex-shrink: 0;
    }

    .print-asset .wordmark {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .print-asset .wordmark .line {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 120px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -2px;
      line-height: 1.1;
    }

    .label {
      color: #666;
      font-family: monospace;
      font-size: 14px;
      text-align: center;
    }

    /* Mascots-only version */
    .mascots-only {
      width: 600px;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mascots-only img {
      width: 400px;
      height: 400px;
    }
  </style>
</head>
<body>
  <!-- Version 1: Horizontal logo (mascots + wordmark) -->
  <div class="label">HORIZONTAL LOGO — 1200 x 500px (scale to 3600 x 1500 at 300dpi for print)</div>
  <div class="print-asset">
    <img class="mascots" src="mascots.svg" alt="mascots">
    <div class="wordmark">
      <div class="line">OpenClaw</div>
      <div class="line">Machines</div>
    </div>
  </div>

  <!-- Version 2: Mascots only (no text) -->
  <div class="label">MASCOTS ONLY — 600 x 500px (for centered chest print)</div>
  <div class="mascots-only">
    <img src="mascots.svg" alt="mascots">
  </div>

  <!-- Version 3: Stacked layout (mascots on top, text below) -->
  <div class="label">STACKED LAYOUT — centered, mascots above text</div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 24px;">
    <img src="mascots.svg" alt="mascots" style="width: 300px; height: 300px;">
    <div style="text-align: center;">
      <div style="font-family: system-ui, -apple-system, sans-serif; font-size: 72px; font-weight: 700; color: #fff; letter-spacing: -1px; line-height: 1.1;">OpenClaw</div>
      <div style="font-family: system-ui, -apple-system, sans-serif; font-size: 72px; font-weight: 700; color: #fff; letter-spacing: -1px; line-height: 1.1;">Machines</div>
    </div>
  </div>
</body>
</html>
