<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="claw-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea4647"/>
      <stop offset="40%" stop-color="#c83232"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bg)"/>

  <!-- Subtle red glow behind claw -->
  <ellipse cx="340" cy="198" rx="250" ry="200" fill="url(#glow)"/>

  <!-- Grid pattern -->
  <g opacity="0.035" stroke="#2DD4BF" stroke-width="1">
    <line x1="0" y1="66" x2="1584" y2="66"/>
    <line x1="0" y1="132" x2="1584" y2="132"/>
    <line x1="0" y1="198" x2="1584" y2="198"/>
    <line x1="0" y1="264" x2="1584" y2="264"/>
    <line x1="0" y1="330" x2="1584" y2="330"/>
    <line x1="264" y1="0" x2="264" y2="396"/>
    <line x1="528" y1="0" x2="528" y2="396"/>
    <line x1="792" y1="0" x2="792" y2="396"/>
    <line x1="1056" y1="0" x2="1056" y2="396"/>
    <line x1="1320" y1="0" x2="1320" y2="396"/>
  </g>

  <!-- Large claw mark — left side -->
  <g transform="translate(220, 68) scale(0.52)">
    <path d="
      M 175 85
      C 140 68, 78 78, 55 125
      C 28 180, 22 255, 50 325
      C 75 390, 145 438, 256 448
      C 367 438, 437 390, 462 325
      C 490 255, 484 180, 457 125
      C 434 78, 372 68, 337 85
      C 318 95, 315 120, 325 152
      C 345 210, 368 278, 350 340
      C 335 380, 298 405, 256 412
      C 214 405, 177 380, 162 340
      C 144 278, 167 210, 187 152
      C 197 120, 194 95, 175 85
      Z
    " fill="url(#claw-grad)" opacity="0.9"/>
    <path d="
      M 170 95
      C 148 82, 105 88, 80 125
      C 58 165, 48 220, 60 275
    " fill="none" stroke="#ea4647" stroke-width="6" stroke-linecap="round" opacity="0.2"/>
  </g>

  <!-- OpenClaw text -->
  <text x="600" y="170" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="72" font-weight="800" fill="#ea4647" letter-spacing="-2">
    OpenClaw
  </text>

  <!-- Machines text -->
  <text x="600" y="248" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="64" font-weight="600" fill="#2DD4BF" letter-spacing="1">
    Machines
  </text>

  <!-- Tagline -->
  <text x="600" y="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#64748b" letter-spacing="2">
    SECURE SANDBOXED OPENCLAW AGENTS IN SECONDS
  </text>

  <!-- Subtle bottom accent -->
  <rect x="600" y="322" width="160" height="2" rx="1" fill="#DC2626" opacity="0.4"/>

  <!-- "by ClaraMap" subtle attribution — bottom right -->
  <text x="1520" y="372" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#475569" letter-spacing="1">
    by Clara<tspan fill="#14B8A6">Map</tspan>
  </text>
</svg>
