<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <linearGradient id="shirt-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="lobster-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="lobster-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dff8e"/>
      <stop offset="100%" stop-color="#1b7a3d"/>
    </linearGradient>
    <linearGradient id="lobster-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d9eff"/>
      <stop offset="100%" stop-color="#1b3e99"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="1.5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="900" fill="#d4d4d4" rx="8"/>

  <!-- T-shirt shape -->
  <path d="
    M 250 120
    L 180 160
    L 100 250
    L 160 290
    L 210 240
    L 210 780
    L 590 780
    L 590 240
    L 640 290
    L 700 250
    L 620 160
    L 550 120
    C 530 100 510 90 400 90
    C 290 90 270 100 250 120
    Z
  " fill="url(#shirt-grad)" stroke="#0a0a0a" stroke-width="2"/>

  <!-- Collar -->
  <path d="
    M 340 95
    C 360 115 380 120 400 120
    C 420 120 440 115 460 95
  " fill="none" stroke="#333" stroke-width="2.5"/>

  <!-- Logo group — placed at upper chest -->
  <g transform="translate(280, 220) scale(0.75)">
    <!-- Back-left mascot (blue) -->
    <g transform="translate(58,52) scale(1.15)" filter="url(#shadow)" opacity="0.85">
      <g transform="translate(-60,-55)">
        <path d="M60 10 C30 10 15 35 15 55 C15 75 30 95 45 100 L45 110 L55 110 L55 100 C55 100 60 102 65 100 L65 110 L75 110 L75 100 C90 95 105 75 105 55 C105 35 90 10 60 10Z" fill="url(#lobster-blue)"/>
        <path d="M20 45 C5 40 0 50 5 60 C10 70 20 65 25 55 C28 48 25 45 20 45Z" fill="url(#lobster-blue)"/>
        <path d="M100 45 C115 40 120 50 115 60 C110 70 100 65 95 55 C92 48 95 45 100 45Z" fill="url(#lobster-blue)"/>
        <path d="M45 15 Q35 5 30 8" stroke="#4d9eff" stroke-width="3" stroke-linecap="round"/>
        <path d="M75 15 Q85 5 90 8" stroke="#4d9eff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="45" cy="35" r="6" fill="#050810"/>
        <circle cx="75" cy="35" r="6" fill="#050810"/>
        <circle cx="46" cy="34" r="2.5" fill="#00e5cc"/>
        <circle cx="76" cy="34" r="2.5" fill="#00e5cc"/>
      </g>
    </g>

    <!-- Back-right mascot (green) -->
    <g transform="translate(148,56) scale(1.15)" filter="url(#shadow)" opacity="0.85">
      <g transform="translate(-60,-55)">
        <path d="M60 10 C30 10 15 35 15 55 C15 75 30 95 45 100 L45 110 L55 110 L55 100 C55 100 60 102 65 100 L65 110 L75 110 L75 100 C90 95 105 75 105 55 C105 35 90 10 60 10Z" fill="url(#lobster-green)"/>
        <path d="M20 45 C5 40 0 50 5 60 C10 70 20 65 25 55 C28 48 25 45 20 45Z" fill="url(#lobster-green)"/>
        <path d="M100 45 C115 40 120 50 115 60 C110 70 100 65 95 55 C92 48 95 45 100 45Z" fill="url(#lobster-green)"/>
        <path d="M45 15 Q35 5 30 8" stroke="#4dff8e" stroke-width="3" stroke-linecap="round"/>
        <path d="M75 15 Q85 5 90 8" stroke="#4dff8e" stroke-width="3" stroke-linecap="round"/>
        <circle cx="45" cy="35" r="6" fill="#050810"/>
        <circle cx="75" cy="35" r="6" fill="#050810"/>
        <circle cx="46" cy="34" r="2.5" fill="#00e5cc"/>
        <circle cx="76" cy="34" r="2.5" fill="#00e5cc"/>
      </g>
    </g>

    <!-- Front-center mascot (red) -->
    <g transform="translate(103,85) scale(1.4)" filter="url(#shadow)">
      <g transform="translate(-60,-55)">
        <path d="M60 10 C30 10 15 35 15 55 C15 75 30 95 45 100 L45 110 L55 110 L55 100 C55 100 60 102 65 100 L65 110 L75 110 L75 100 C90 95 105 75 105 55 C105 35 90 10 60 10Z" fill="url(#lobster-red)"/>
        <path d="M20 45 C5 40 0 50 5 60 C10 70 20 65 25 55 C28 48 25 45 20 45Z" fill="url(#lobster-red)"/>
        <path d="M100 45 C115 40 120 50 115 60 C110 70 100 65 95 55 C92 48 95 45 100 45Z" fill="url(#lobster-red)"/>
        <path d="M45 15 Q35 5 30 8" stroke="#ff4d4d" stroke-width="3" stroke-linecap="round"/>
        <path d="M75 15 Q85 5 90 8" stroke="#ff4d4d" stroke-width="3" stroke-linecap="round"/>
        <circle cx="45" cy="35" r="6" fill="#050810"/>
        <circle cx="75" cy="35" r="6" fill="#050810"/>
        <circle cx="46" cy="34" r="2.5" fill="#00e5cc"/>
        <circle cx="76" cy="34" r="2.5" fill="#00e5cc"/>
      </g>
    </g>

    <!-- Wordmark -->
    <text x="230" y="88" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">
      OpenClaw
    </text>
    <text x="230" y="138" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">
      Machines
    </text>
  </g>
</svg>
