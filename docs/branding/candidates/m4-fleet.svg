<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 48">
  <!-- The fleet: every machine is its own isolated agent -->
  <g transform="translate(2,0)">
  <!-- Box crab, polished: microVM-squircle body, eyes on crab stalks,
       docked open pincers with shoulder joints. -->
  <g fill="#3B82F6">
    <!-- eye stalks -->
    <rect x="16.5" y="7" width="3.2" height="9" rx="1.6"/>
    <rect x="28.3" y="7" width="3.2" height="9" rx="1.6"/>
    <!-- shoulders docking the claws to the body -->
    <rect x="7" y="24" width="6" height="5" rx="2.5"/>
    <rect x="35" y="24" width="6" height="5" rx="2.5"/>
    <!-- left pincer: open C, gape up-out -->
    <path d="M10 17.5 C 4 17, 0.5 22, 1.5 27.5 C 2.4 32.3, 6.5 35.5, 11 34.8 L 10.2 30.3
             C 7.8 30.5, 5.9 28.9, 5.6 26.5 C 5.3 24, 7 22.1, 9.8 22 Z"/>
    <!-- right pincer -->
    <path d="M38 17.5 C 44 17, 47.5 22, 46.5 27.5 C 45.6 32.3, 41.5 35.5, 37 34.8 L 37.8 30.3
             C 40.2 30.5, 42.1 28.9, 42.4 26.5 C 42.7 24, 41 22.1, 38.2 22 Z"/>
    <!-- body: the microVM (rx matches the mark's nucleus ratio) -->
    <rect x="11" y="14" width="26" height="26" rx="8"/>
    <!-- legs -->
    <rect x="17" y="41" width="5" height="5.5" rx="2.5"/>
    <rect x="26" y="41" width="5" height="5.5" rx="2.5"/>
  </g>
  <!-- eyes on the stalks: orange rim so they hold on any background -->
  <g fill="#3B82F6">
    <circle cx="18.1" cy="7.5" r="4.8"/>
    <circle cx="29.9" cy="7.5" r="4.8"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="18.1" cy="7.5" r="3.4"/>
    <circle cx="29.9" cy="7.5" r="3.4"/>
  </g>
  <g fill="#0B0B10">
    <circle cx="18.7" cy="8" r="1.8"/>
    <circle cx="30.5" cy="8" r="1.8"/>
  </g>
  <!-- smile on the body -->
  <path d="M19.5 25.5 Q 24 29.5, 28.5 25.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
</g>
