<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Same asymmetric grip, soft variant: rounded joins matching the VM's
       corner language. Built from stroked polylines with round joins. -->
  <g fill="none" stroke="#EA580C" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- dominant jaw -->
    <path d="M20 6.5 L13.5 6.5 L6.5 13.5 L6.5 34.5 L13.5 41.5 L34.5 41.5 L41.5 34.5 L41.5 29"/>
    <!-- thumb plate -->
    <path d="M28.5 6.5 L34.5 6.5 L41.5 13.5 L41.5 19"/>
  </g>
  <g fill="#EA580C">
    <!-- teeth -->
    <path d="M23 38 L27.5 33.2 L32 38 Z"/>
    <path d="M38 14.5 L33.2 18.5 L38 22.5 Z"/>
    <!-- the held microVM -->
    <rect x="16.5" y="16.5" width="13" height="13" rx="4"/>
  </g>
</svg>
