<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Mark-coherent mascot: the r5 jaw shape becomes the mascot's claw,
       a friendly agent peeking from inside -->
  <g fill="#EA580C">
    <!-- the r5 dominant jaw, scaled as the mascot's shell -->
    <path d="M 22 3 L 12 3 L 3 12 L 3 36 L 12 45 L 36 45 L 45 36 L 45 29
             L 38 29 L 38 33.2 L 33.2 38 L 14.8 38 L 10 33.2 L 10 14.8 L 14.8 10 L 22 10 Z"/>
    <!-- thumb -->
    <path d="M 26 3 L 37 3 L 45 11 L 45 25 L 38 25 L 38 13.8 L 34.2 10 L 26 10 Z"/>
    <!-- the agent: squircle body inside, face on it -->
    <rect x="15" y="16" width="18" height="18" rx="6"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="20.5" cy="23" r="2.8"/>
    <circle cx="27.5" cy="23" r="2.8"/>
  </g>
  <g fill="#0B0B10">
    <circle cx="21" cy="23.5" r="1.4"/>
    <circle cx="28" cy="23.5" r="1.4"/>
  </g>
  <path d="M21 28.5 Q 24 31, 27 28.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
</svg>
