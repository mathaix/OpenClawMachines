    <path d="M36.9 11.9
             A 19 19 0 1 0 36.9 36.1
             L 31.9 30.6
             A 11.5 11.5 0 1 1 31.9 17.4
             Z"/>
    <!-- fang: hangs from the upper jaw, points at the squircle -->
