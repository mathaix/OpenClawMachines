<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Fiddler crab, geometric: VM-square body, pincers BESIDE the body,
       jaw gaps facing inward; deliberate 2x asymmetry. -->
  <g fill="#EA580C">
    <!-- body -->
    <rect x="14" y="14" width="20" height="20" rx="6"/>
    <!-- big left pincer: C-shape opening rightward (toward body) -->
    <path d="M11 8
             C 4.5 9.5, 1 15, 1 21
             C 1 27, 4.5 32.5, 11 34
             L 11 28.5
             C 8.5 27.5, 6.5 24.5, 6.5 21
             C 6.5 17.5, 8.5 14.5, 11 13.5 Z"/>
    <!-- small right pincer: opening leftward, half the size -->
    <path d="M37 14
             C 41.5 15, 44 18.5, 44 22
             C 44 25.5, 41.5 29, 37 30
             L 37 26
             C 39 25.3, 40.2 23.8, 40.2 22
             C 40.2 20.2, 39 18.7, 37 18 Z"/>
    <!-- legs: two stubs under body -->
    <rect x="17" y="36" width="5" height="6" rx="2.5"/>
    <rect x="26" y="36" width="5" height="6" rx="2.5"/>
  </g>
  <!-- wide eye apertures (negative space) -->
  <g fill="#FFFFFF">
    <rect x="19" y="19" width="4" height="9" rx="2"/>
    <rect x="25" y="19" width="4" height="9" rx="2"/>
  </g>
</svg>
