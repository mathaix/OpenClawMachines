<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Sleek minimal lobster glyph: teardrop body, two raised open claws,
       fan tail. One color, clean curves. -->
  <g fill="#EA580C">
    <!-- claws: open Cs raised above -->
    <path d="M13.5 14.5 C 8 13, 3.5 16.5, 3.5 22 C 3.5 26.5, 6.5 29.8, 11 30.2 L 11.2 25.8
             C 9 25.5, 7.7 24.1, 7.8 22 C 7.9 19.7, 10 18.3, 12.8 18.8 Z"/>
    <path d="M34.5 14.5 C 40 13, 44.5 16.5, 44.5 22 C 44.5 26.5, 41.5 29.8, 37 30.2 L 36.8 25.8
             C 39 25.5, 40.3 24.1, 40.2 22 C 40.1 19.7, 38 18.3, 35.2 18.8 Z"/>
    <!-- body: teardrop -->
    <path d="M24 8 C 31 8, 35.5 14, 35.5 22 C 35.5 30, 30.5 36.5, 24 36.5
             C 17.5 36.5, 12.5 30, 12.5 22 C 12.5 14, 17 8, 24 8 Z"/>
    <!-- tail fan -->
    <path d="M24 35 L 17 44 L 22.5 43 L 24 46 L 25.5 43 L 31 44 Z"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="19.5" cy="18.5" r="3.4"/>
    <circle cx="28.5" cy="18.5" r="3.4"/>
  </g>
  <g fill="#0B0B10">
    <circle cx="20.2" cy="19.2" r="1.7"/>
    <circle cx="29.2" cy="19.2" r="1.7"/>
  </g>
  <path d="M20.5 26 Q 24 29, 27.5 26" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
</svg>
